name: Roblox Tracker

on:
  schedule:
    # Cada 3 horas. En el minuto 17 y no en punto: GitHub retrasa mucho
    # (o se salta) los cron de las horas en punto porque es cuando más cola hay.
    - cron: "17 */3 * * *"
  workflow_dispatch:        # ejecución manual desde la pestaña Actions
    inputs:
      aviso:
        description: "Forzar un resumen de Telegram"
        type: choice
        options: [ninguno, diario, semanal]
        default: ninguno
  push:                     # al cambiar el código, se regenera todo al momento
    branches: [main]
    paths: ["*.py", ".github/workflows/tracker.yml"]

permissions:
  contents: write

# Evita que dos ejecuciones pisen el repo a la vez
concurrency:
  group: tracker-commit
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # La punta de main en este momento, no el commit que lanzó el run:
          # si había otro run en cola, así se parte de los datos que guardó
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tomar muestra de todos los juegos
        run: python tracker.py

      - name: Exportar dashboard
        run: python export_dashboard.py

      - name: Avisos de Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AVISO: ${{ github.event.inputs.aviso }}
        run: |
          case "$AVISO" in
            diario)  python notifier.py --daily ;;
            semanal) python notifier.py --weekly ;;
            *)       python notifier.py ;;
          esac

      - name: Commit cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "track: $(date -u +%Y-%m-%dT%H:%M)"
          # Si a la vez se subió otro commit, se rebasa encima. Las muestras
          # de data/raw se juntan (.gitattributes: merge=union); en el resto de
          # data/ manda lo de este run (-X theirs en un rebase), que se
          # recalcula igualmente en la siguiente ejecución
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "Reintento push $i…" && sleep 5
          done
          echo "::error::No se pudieron subir los datos tras 3 intentos"
          exit 1
