name: Roblox Tracker

on:
  schedule:
    # Cada 3 horas. En el minuto 17 y no en punto: GitHub retrasa mucho
    # (o se salta) los cron de las horas en punto porque es cuando más cola hay.
    - cron: "17 */3 * * *"
  workflow_dispatch:        # ejecución manual desde la pestaña Actions
    inputs:
      aviso:
        description: "Forzar un resumen de Telegram"
        type: choice
        options: [ninguno, diario, semanal]
        default: ninguno
  push:                     # al cambiar el código o la web, se regenera y se publica
    branches: [main]
    paths: ["*.py", "dashboard.html", "favicon.svg", ".github/workflows/tracker.yml"]

permissions:
  contents: read            # los datos ya no se guardan en el repo, sino en R2

# Dos ejecuciones a la vez se pisarían los datos en R2
concurrency:
  group: tracker
  cancel-in-progress: false

env:
  TRACKER_API: https://roblox-tracker.stonksstudiouefn.workers.dev
  TRACKER_TOKEN: ${{ secrets.TRACKER_TOKEN }}

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar datos de R2
        id: pull
        run: python remote.py pull

      - name: Tomar muestra de todos los juegos
        run: python tracker.py

      - name: Exportar dashboard
        run: python export_dashboard.py

      - name: Avisos de Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AVISO: ${{ github.event.inputs.aviso }}
        run: |
          case "$AVISO" in
            diario)  python notifier.py --daily ;;
            semanal) python notifier.py --weekly ;;
            *)       python notifier.py ;;
          esac

      # Se guarda aunque falle Telegram; nunca si no se pudieron descargar
      - name: Guardar datos y web en R2
        if: always() && steps.pull.outcome == 'success'
        run: python remote.py push
