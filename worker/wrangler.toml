# Despliegue manual (opcional): cd worker && npx wrangler deploy
# El secret se pone una vez con: npx wrangler secret put INGEST_TOKEN
name = "roblox-tracker"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

routes = [
  { pattern = "robloxtracker.stonksstudio.com", custom_domain = true },
]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "roblox-tracker"
